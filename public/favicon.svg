<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Snake Arrow 1: Top-Left (Navy) -->
  <path d="M 230 200 L 230 140 L 160 140" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="160,116 120,140 160,164" fill="#0f172a"/>

  <!-- Snake Arrow 2: Top-Right (Navy) -->
  <path d="M 330 220 L 330 140 L 300 140" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="300,116 270,140 300,164" fill="#0f172a"/>
  
  <!-- Snake Arrow 3: Center-Right (Vibrant Blue - accent like screenshot 1) -->
  <path d="M 270 140 L 270 240 L 360 240" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="360,216 400,240 360,264" fill="#2563eb"/>

  <!-- Snake Arrow 4: Bottom-Left (Navy) -->
  <path d="M 175 360 L 175 270 L 210 270" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="186,240 210,270 186,300" fill="#0f172a" transform="rotate(-90 210 270)"/>

  <!-- Snake Arrow 5: Bottom-Right (Navy) -->
  <path d="M 240 220 L 240 320 L 340 320 L 340 360 L 260 360" fill="none" stroke="#0f172a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="260,336 220,360 260,384" fill="#0f172a"/>
</svg>
